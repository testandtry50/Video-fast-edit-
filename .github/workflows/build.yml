name: Build APK

# Runs automatically every time you push to main, and can also be triggered manually
# from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Signing secrets for the Play Store bundle (see PLAY_STORE_CHECKLIST.md). When they are not set, the
    # debug APK and the tests still run exactly as before and the signed bundle step is skipped.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Works whether you pushed the extracted project directly, or just uploaded the
      # VideoSlideMaker-Android.zip file itself through GitHub's website — either way,
      # this step figures out where the real project files ended up.
      - name: Locate the project (extract zip if needed)
        id: locate
        run: |
          if ls *.zip >/dev/null 2>&1; then
            ZIP_FILE=$(ls *.zip | head -n 1)
            echo "Found $ZIP_FILE — extracting it"
            unzip -o "$ZIP_FILE"
            PROJECT_DIR=$(find . -maxdepth 1 -type d -name "VideoSlideMaker*" | head -n 1)
            echo "dir=${PROJECT_DIR#./}" >> "$GITHUB_OUTPUT"
          elif [ -f "settings.gradle.kts" ]; then
            echo "Project already at repo root"
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::Couldn't find settings.gradle.kts or a .zip to extract at the repo root."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Google Play needs apps to target Android 16 (API 36); the Android Gradle plugin 8.9 uses build-tools 35.
      - name: Install the exact SDK platform/build-tools this project needs
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      # This project's Gradle wrapper jar wasn't generated in the sandbox it was written in
      # (no internet access there). These two steps regenerate a complete, working wrapper
      # before the real build runs, so everything below behaves like any normal Android project.
      - name: Install a temporary Gradle to (re)generate the wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate Gradle wrapper
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle wrapper --gradle-version 8.11.1

      - name: Make gradlew executable
        working-directory: ${{ steps.locate.outputs.dir }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        # Output goes to the screen AND to build.log, so the "Show the build errors" step below can pick out the real error.
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoSlideMaker-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Run unit tests
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # Google Play rejects apps whose native libraries are not aligned for 16 KB memory pages. This only REPORTS (it
      # never fails the build); the same check on the signed bundle is in the checklist.
      - name: Check 16 KB page-size alignment (report only)
        continue-on-error: true
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          ZIPALIGN=$(find "$ANDROID_SDK_ROOT/build-tools" -name zipalign | sort | tail -1)
          "$ZIPALIGN" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk | tail -n 8

      - name: Prepare the signing key
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"

      # The file Google Play wants. Upload app-release.aab in Play Console > Release > Production (or Testing).
      - name: Build the signed Play Store bundle (AAB)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew bundleRelease --console=plain 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Upload the Play Store bundle
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: VideoSlideMaker-release-aab
          path: |
            ${{ steps.locate.outputs.dir }}/app/build/outputs/bundle/release/app-release.aab
            ${{ steps.locate.outputs.dir }}/app/build/outputs/mapping/release/mapping.txt

      # Only runs when something above failed. Puts the short, readable error on the run's Summary page (open the run,
      # then tap "Summary") and keeps the full log as a downloadable artifact.
      - name: Show the build errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          {
            echo "## Why the build failed"
            if [ -f "$LOG" ]; then
              echo '### Kotlin / compiler errors'
              echo '```'
              grep -E '^e: |error: ' "$LOG" | sed 's#file://[^ ]*/VideoSlideMaker/##; s#file://[^ ]*/work/[^/]*/[^/]*/##' | sort -u | head -n 60
              echo '```'
              echo '### Gradle says'
              echo '```'
              sed -n '/What went wrong/,/^\* Try/p' "$LOG" | head -n 40
              echo '```'
              echo '### Failed tests'
              echo '```'
              grep -E 'FAILED$|AssertionError|Test.*FAILED' "$LOG" | head -n 30
              echo '```'
            else
              echo "No build log was written - the failure happened before Gradle started. Open the red step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
